services:
    database:
        image: mariadb:11.4
        container_name: dnd-portal-test-database
        restart: "no"
        ports:
            - "127.0.0.1:3307:3306"
        environment:
            MARIADB_DATABASE: dnd_portal_test
            MARIADB_USER: dnd_test
            MARIADB_PASSWORD: local-test-only
            MARIADB_ROOT_PASSWORD: local-root-only
        volumes:
            - dnd-portal-test-db:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -plocal-root-only"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s

volumes:
    dnd-portal-test-db:
        name: dnd-portal-test-db
