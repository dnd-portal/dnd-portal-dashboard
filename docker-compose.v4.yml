services:
  database:
    image: mariadb:11.4.13
    container_name: dnd-portal-v4-mariadb
    environment:
      MARIADB_DATABASE: dnd_portal_v4_development
      MARIADB_USER: dnd_v4
      MARIADB_PASSWORD: local-v4-only
      MARIADB_ROOT_PASSWORD: local-v4-root-only
    ports: ["127.0.0.1:3310:3306"]
    volumes: [dnd-portal-v4-db:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -plocal-v4-root-only"]
      interval: 5s
      timeout: 3s
      retries: 30
  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: dnd-portal-v4-phpmyadmin
    depends_on: {database: {condition: service_healthy}}
    environment: {PMA_HOST: database, PMA_PORT: 3306}
    ports: ["127.0.0.1:8096:80"]
  database-preview:
    image: mariadb:11.4.13
    container_name: dnd-portal-v4-mariadb-preview
    environment:
      MARIADB_DATABASE: dnd_portal_v4_preview
      MARIADB_USER: dnd_v4_preview
      MARIADB_PASSWORD: local-v4-preview-only
      MARIADB_ROOT_PASSWORD: local-v4-preview-root-only
    ports: ["127.0.0.1:3311:3306"]
    volumes: [dnd-portal-v4-preview-db:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -plocal-v4-preview-root-only"]
      interval: 5s
      timeout: 3s
      retries: 30
  deployment-preview:
    build:
      context: ./development/deployment-preview
    container_name: dnd-portal-v4-deployment-preview
    depends_on:
      database-preview:
        condition: service_healthy
    ports: ["127.0.0.1:8184:80"]
    volumes:
      - ./runtime/package-stage:/var/www/html:ro
      - ./backend/.env.preview:/var/www/html/server/.env:ro
      - ./runtime/apache-logs:/var/log/apache2
volumes:
  dnd-portal-v4-db: {name: dnd-portal-v4-db}
  dnd-portal-v4-preview-db: {name: dnd-portal-v4-preview-db}
